<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../static/base.css" rel="stylesheet" />
    <title>{% block title %}MySite{% endblock title %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top px-4 py-2">
        <button class="toggle-sidebar" onclick="toggleSidebar()">☰ Menu</button>
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">VisitDesk</a>
            <div class="ms-auto d-flex align-items-center gap-3">
               <span class="text-white me-3">Welcome, {{ session['username'] }}</span>  
                <!-- <-- Three-dot Dropdown -->
                <div class="dropdown">
                    <button  type="button" id="menuButton" data-bs-toggle="dropdown" aria-expanded="false"  style="background-color: rgba(0, 0, 0, 0.1);;">
    <a href="{{url_for('auth.profile')}}"><img src="static/images/{{ session['profile_image'] }}" width="50px" height="50px" class="rounded-circle " alt="Avatar"></a>
    </button>
                    <!-- Dropdown Menu -->
                    <ul class="dropdown-menu dropdown-menu-end text-center p-3 " aria-labelledby="menuButton" style="min-width: 280px; min-height: 300px;">

                        <!-- <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="menuButton"> -->
                        <li class="px-3 py-2  ">
                            <div class="text-center">
                                 <img src="{{ url_for('auth.profile_image') }}" alt="Profile Image"
                     style="width: 100px; height: 95px; margin-left: 55px; border-radius: 50%; object-fit: cover;" class="profile-img">

                                <h6 class="mb-0">{{ name }}</h6>
                                <small class="text-muted">{{ email }}</small>
                                <div class="d-grid gap-3 mt-4 ">
                                    <a href="{{ url_for('routes.logoutsecurity') }}" class="btn btn-sm btn-primary">Log Out</a>
                                    <a href="{{ url_for('auth.view_profile') }}" class="btn btn-sm btn-secondary">View Profile</a>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Optional Avatar -->
    <a href="{{ url_for('auth.profile') }}">
        <!-- <img src="https://i.pravatar.cc/40" class="rounded-circle border border-white" alt="Avatar"> -->
    </a>
    </div>
    </div>
    </nav>

    <!-- Main Layout -->
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 col-sm-3 sidebar nav flex-column nav-pills" id="sidebar-tab" role="tablist">
                <a class="nav-link {% if request.path == url_for('admin.admin_h') %}active{% endif %}" href="{{url_for('admin.admin_h')}}">Home</a>
                <a class="nav-link {% if request.path == url_for('admin.filter_role') %}active{% endif %}" href="{{url_for('admin.filter_role')}}">User Overview</a>
                <a class="nav-link {% if request.path == url_for('admin.visitor_over') %}active{% endif %}" href="{{url_for('admin.visitor_over')}}">Visitor Overview</a>
                <a class="nav-link {% if request.path == url_for('admin.notification') %}active{% endif %}" href="{{url_for('admin.notification')}}">Notification</a>
                <a class="nav-link {% if request.path == url_for('routes.logout') %}active{% endif %}" href="{{url_for('routes.logout')}}">Logout</a>
            </nav>

            <!-- Content Area -->
            <main class="col-md-10 col-sm-9 py-4">
                {% block body %}{% endblock body %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('active');
        }
    </script>
</body>

</html>
