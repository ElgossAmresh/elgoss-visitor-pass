<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../static/base.css" rel="stylesheet" />

    <title>{% block title %}MySite{% endblock title %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top px-4 py-2">
        <button class="toggle-sidebar" onclick="toggleSidebar()">☰ Menu</button>
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">VisitDesk</a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="text-white me-3">Welcome, {{ session['username'] }}</span>
         

    <!-- Profile Dropdown -->

    <div class="dropdown"> 
    <button type="button" id="menuButton" data-bs-toggle="dropdown" aria-expanded="false"
        style="background-color: rgba(0, 0, 0, 0.1); border: none;">
       <a href="">
    {% if session['profile_image'] %}
    
        <img src="{{ url_for('auth.profile_image') }}" alt="Profile Image"
             class="rounded-circle"
             style="width: 50px; height: 50px; object-fit: cover;">
    {% else %}
        <div id="profileLetter" class="rounded-circle text-white d-flex justify-content-center align-items-center"
             style="width: 50px; height: 50px; background-color: #6c757d; font-weight: bold; font-size: 20px;">
            {{ session['username_short'] }}
        </div>
    {% endif %}
</a>
 </button>

               

     <!-- Dropdown Menu -->
    <ul class="dropdown-menu dropdown-menu-end text-center p-3"
    aria-labelledby="menuButton" style="min-width: 280px; min-height: 300px;">
    <li class="px-3 py-2">

    {% if session['profile_image']%}
    <img src="{{ url_for('auth.profile_image') }}" alt="Profile Image"
        style="width: 100px; height: 95px; margin-left: 55px; border-radius: 50%; object-fit: cover;"
        class="profile-img">

{% else %}
    <div class="rounded-circle text-white d-flex justify-content-center align-items-center"
         style="width: 100px; height: 95px; margin-left: 55px; background-color: #6c757d; font-size: 36px; font-weight: bold;">
        {{ session['username_short'] }}
    </div>
{% endif %}

    <small class="text-muted">{{ email }}</small> 
    <div class="d-grid gap-3 mt-4">
    <a href="{{ url_for('routes.logoutsecurity') }}" class="btn btn-sm btn-primary">Log Out</a>
    <a href="{{ url_for('auth.view_profile') }}" class="btn btn-sm btn-secondary">View Profile</a>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Layout -->
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 col-sm-3 sidebar nav flex-column nav-pills" id="sidebar-tab" role="tablist">
                <a class="nav-link {% if request.path == url_for('admin.admin_h') %}active{% endif %}" href="{{ url_for('admin.admin_h') }}">Dashboard</a>
                <a class="nav-link {% if request.path == url_for('admin.filter_role') %}active{% endif %}" href="{{ url_for('admin.filter_role') }}">User </a>
                <a class="nav-link {% if request.path == url_for('admin.visitor_over') %}active{% endif %}" href="{{ url_for('admin.visitor_over') }}">Visitor </a>
                <a class="nav-link {% if request.path == url_for('admin.notification') %}active{% endif %}" href="{{ url_for('admin.notification') }}">Notification</a>
                <a class="nav-link {% if request.path == url_for('routes.logout') %}active{% endif %}" href="{{ url_for('routes.logout') }}">Logout</a>
            </nav>

    <!-- Content Area -->

            <main class="col-md-10 col-sm-9 py-4">
            {% block body %}{% endblock body %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('active');
        }     
    </script>
</body>
</html>
