{% extends 'security_base.html' %}

{% block title %}OTP Verification{% endblock title %}

{% block body %}
 <link href="../static/sms.css" rel="stylesheet" />

<div class="otp-box">
    <h1 class="pv">Phone Verification</h1>
    <p class="subtitle">Enter your mobile number to receive an OTP</p>
    
    <form method="POST" action="{{ url_for('otp_gen.send_sms') }}">
    <input type="tel" name="phone" placeholder="Enter Mobile Number" 
           pattern="^\+?[0-9]{10,12}$" maxlength="13" required
           oninput="this.value = this.value.replace(/(?!^\+)[^\d]/g, '')">
    <button type="submit">Send OTP</button>
</form>


</div>
{% endblock body %}
