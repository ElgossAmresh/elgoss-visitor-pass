{% extends 'security_base.html' %} {% block title %}otp verify{% endblock %} {% block body %}

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
    * {
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
    }
    
    body {
        background: #f3f6fc;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    .otp-container {
        background-color: white;
        padding: 40px 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.07);
        max-width: 400px;
        width: 100%;
        text-align: center;
    }
    
    h2 {
        font-size: 22px;
        color: #333;
        margin-bottom: 10px;
    }
    
    p {
        font-size: 14px;
        color: #666;
        margin-bottom: 25px;
    }
    
    .otp-inputs {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 25px;
    }
    
    .otp-box {
        width: 60px;
        height: 60px;
        font-size: 22px;
        text-align: center;
        border: 1px solid #ccc;
        border-radius: 10px;
        transition: all 0.2s ease-in-out;
    }
    
    .otp-box:focus {
        border-color: #007bff;
        box-shadow: 0 0 6px rgba(0, 123, 255, 0.5);
        outline: none;
    }
    
    .validate-btn {
        width: 100%;
        padding: 14px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s ease;
    }
    
    .validate-btn:hover {
        background-color: #0056b3;
    }
    
    .resend {
        margin-top: 20px;
        font-size: 14px;
        color: #555;
    }
    
    .resend a {
        color: #007bff;
        text-decoration: none;
        font-weight: 500;
    }
    
    .resend a:hover {
        text-decoration: underline;
    }
    
    .center-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100%;
    }
    /* Keep your existing .otp-container styles */
</style>

<div class="center-wrapper">
    <div class="otp-container">
        <h2>OTP Verification</h2>
        <p>A 4-digit code has been sent to your number ending in ******0000</p>

        <form action="{{ url_for('otp_gen.sms_match') }}" method="POST">
            <div class="otp-inputs">
                <input type="text" name="o" maxlength="1" class="otp-box" required>
                <input type="text" name="to" maxlength="1" class="otp-box" required>
                <input type="text" name="th" maxlength="1" class="otp-box" required>
                <input type="text" name="f" maxlength="1" class="otp-box" required>
            </div>
            <button type="submit" class="validate-btn">Verify OTP</button>
        </form>

        <p class="resend">Didn't receive the code? <a href="/resend">Resend (1/3)</a></p>
    </div>
</div>



<script>
    document.addEventListener('DOMContentLoaded', () => {
        const inputs = document.querySelectorAll('.otp-box');

        // Auto-focus the first box on page load
        if (inputs.length > 0) {
            inputs[0].focus();
        }

        inputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    });
</script>



{% endblock body %}
