<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Profile (SAP Styled)</title>
  <style>
    body {
      margin: 0;
      font-family: "72", "Segoe UI", sans-serif;
      background: #f4f4f4;
    }

    .container {
      display: flex;
      padding: 20px;
    }

    .sidebar {
      width: 250px;
      background: #fff;
      text-align: center;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      margin-right: 20px;
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .upload-btn {
      display: inline-block;
      background: #0070f2;
      color: white;
      padding: 6px 12px;
      margin-top: 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    main.profile-form {
      flex: 1;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    .profile-form h1 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    .profile-form section {
      margin-bottom: 30px;
    }

    .profile-form h3 {
      margin-bottom: 10px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }

    input.sap-input,
    select.sap-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d1d1;
      border-radius: 4px;
      background-color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.2s ease-in-out;
    }

    input.sap-input:focus,
    select.sap-input:focus {
      outline: none;
      border-color: #0070f2;
      box-shadow: 0 0 0 2px rgba(0,112,242,0.2);
    }

    .form-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn.update {
      background: #0a6ed1;
      color: white;
    }

    .btn.reset {
      background: #6c757d;
      color: white;
    }

    label {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <img src="https://via.placeholder.com/120" alt="Profile Picture" class="profile-img" />
      <h2>subham Patel</h2>
      <p>Web Designer</p>
      <input type="file" id="upload" hidden />
      <label for="upload" class="upload-btn">Change Picture</label>
    </aside>

    <main class="profile-form">
      <h1>Edit Profile</h1>
      <form>
        <section>
          <h3>General</h3>
          <div class="form-grid">
            <input type="text" placeholder="First Name" class="sap-input" />
            <input type="text" placeholder="Last Name" class="sap-input" />
            <input type="text" placeholder="Email" class="sap-input" />
            <input type="date" placeholder="Date of Birth" class="sap-input" />
            <select class="sap-input">
              <option selected disabled>Department</option>
              <option>Design</option>
              <option>Development</option>
            </select>
            <select class="sap-input">
              <option selected disabled>Skills</option>
              <option>HTML</option>
              <option>CSS</option>
              <option>JS</option>
              <option>JAVA</option>
              <option>PHP</option>
              <option>Python</option>
              <option>C#</option>
              <option>Node.js</option>
              <option>My SQL</option>
              <option>React.js</option>
              <option>C</option> 
              <option>QT</option>
              

            </select>
            <select class="sap-input">
              <option selected disabled>Gender</option>
              <option>Male</option>
              <option>Female</option>
            </select>
            <input type="text" placeholder="Company" class="sap-input" />
          </div>
        </section>

        <section>
          <h3>Contact</h3>
          <div class="form-grid">
            <input type="text" placeholder="Contact Number" class="sap-input" required />
            <input type="" placeholder="Confirm Number" class="sap-input" required />
          </div>
        </section>

        <section>
          <h3>Address</h3>
          <div class="form-grid">
            <input type="text" placeholder="Street" class="sap-input" />
            <input type="text" placeholder="State" class="sap-input" />
            <input type="text" placeholder="ZIP" class="sap-input" />
            <input type="text" placeholder="City" class="sap-input" />
            <input type="text" placeholder="Country" class="sap-input" />
          </div>
        </section>

        <div class="form-actions">
          <button type="submit" class="btn update">Update</button>
          <button type="reset" class="btn reset">Reset</button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
