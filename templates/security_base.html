<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="{{ url_for('static', filename='base.css') }}" rel="stylesheet" />
    <title>{% block title %}MySite{% endblock title %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>

<body>

    <!-- Toggle Sidebar Button (only on small screens) -->
    <button class="toggle-sidebar" onclick="toggleSidebar()">☰ Menu</button>

    <!-- Top Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top px-4 py-2">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="">Visit Desk</a>
            <div class="ms-auto d-flex align-items-center">
              <span class="text-white me-3">Welcome, {{ session['username'] }}</span>  
              
                <div class="dropdown">
                    <button class="" type="button" id="menuButton" data-bs-toggle="dropdown" aria-expanded="false"style="background-color: rgba(0, 0, 0, 0.1);;">
                  <a href="{{url_for('auth.profile')}}"><img src="static/images/{{ session['profile_image'] }}" width="50px" height="50px" class="rounded-circle " alt="{{split}}"></a>
    </button>
                    <!-- Dropdown Menu -->
                    <ul class="dropdown-menu dropdown-menu-end text-center p-3 " aria-labelledby="menuButton" style="min-width: 280px; min-height: 300px;">

    
                        <li class="px-3 py-2  ">
                            <div class="text-center">
                                <div class="ms-auto d-flex align-items-center">
                               
                     <img src="{{ url_for('auth.profile_image') }}" alt="Profile Image"
                     style="width: 100px; height: 95px; margin-left: 55px; border-radius: 50%; object-fit: cover;" class="profile-img">

                     </div>
                     </div>
                                  <span class="text-white me-3"> {{ session['username'] }}</span>  
                                   <span class="text-white me-3"> {{ session['Email'] }}</span>  

                                <div class="d-grid gap-3 mt-4 ">
                                    <a href="{{ url_for('routes.logoutsecurity') }}" class="btn btn-sm btn-primary">Log Out</a>
                                    <a href="{{ url_for('auth.view_profile') }}" class="btn btn-sm btn-secondary">View Profile</a>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>


    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->

            <nav class="col-md-2 col-sm-3 sidebar nav flex-column nav-pills" id="sidebar-tab" role="tablist">
                <a class="nav-link {% if request.path == url_for('security.home') %}active{% endif %}" href="{{ url_for('security.security_home') }}">Dashboard</a>
                <a class="nav-link {% if request.path == url_for('otp_gen.send_sms') %}active{% endif %}" href="{{ url_for('otp_gen.send_sms') }}">Visitor Pass</a>
                <a class="nav-link {% if request.path == url_for('security.visitor') %}active{% endif %}" href="{{ url_for('security.visitor') }}">Visitors</a>
                <a class="nav-link {% if request.path == url_for('routes.logoutsecurity') %}active{% endif %}" href="{{ url_for('routes.logoutsecurity') }}">Logout</a>

            </nav>

            <!-- Main Content Area -->
            <main class="col-md-10 col-sm-9 py-4 content-area">
                {% block body %} {% endblock body %}
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('active');
        }
    </script>

</body>

</html>
